name: Halmos

on:
  pull_request:
  push:
    branches: [main]

jobs:
  halmos:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install Halmos
        run: |
          pip install --upgrade pip
          pip install halmos
          halmos --version

      - name: Build (forge)
        run: forge build --skip script

      - name: Run Halmos — SolvencyOracle
        run: |
          set +e
          halmos --contract SolvencyOracleHalmos --solver-timeout-assertion 600 2>&1 | tee halmos-SolvencyOracle.log
          exit 0
        continue-on-error: true

      - name: Run Halmos — TWAPBurner
        run: |
          set +e
          halmos --contract TWAPBurnerHalmos --solver-timeout-assertion 600 2>&1 | tee halmos-TWAPBurner.log
          exit 0
        continue-on-error: true

      - name: Run Halmos — BondVault
        run: |
          set +e
          halmos --contract BondVaultHalmos --solver-timeout-assertion 600 2>&1 | tee halmos-BondVault.log
          exit 0
        continue-on-error: true

      - name: Run Halmos — PolicyManagerV2
        run: |
          set +e
          halmos --contract PolicyManagerV2Halmos --solver-timeout-assertion 600 2>&1 | tee halmos-PolicyManagerV2.log
          exit 0
        continue-on-error: true

      - name: Upload Halmos reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halmos-reports
          path: halmos-*.log
          if-no-files-found: warn
          retention-days: 30
