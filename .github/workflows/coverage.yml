name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Forge coverage (summary + lcov, --ir-minimum)
        # [Sprint Y] --ir-minimum enables via_ir with minimum optimization to
        # avoid "stack too deep" errors that surface when forge coverage disables
        # the standard optimizer settings (DeployLuminaV5Complete.s.sol L210).
        # continue-on-error: true so the artifact still uploads even if a single
        # contract trips coverage instrumentation bugs.
        run: |
          set -o pipefail
          forge coverage --ir-minimum --report summary --report lcov 2>&1 | tee coverage-summary.txt
        continue-on-error: true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-summary.txt
            lcov.info
          if-no-files-found: warn
          retention-days: 30
