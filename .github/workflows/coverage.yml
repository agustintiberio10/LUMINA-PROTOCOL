name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Forge coverage (summary + lcov)
        # [Sprint Y] continue-on-error because individual contracts may stack-too-deep
        # under coverage instrumentation (via_ir + IR-Yul rewrite cost). The artifact
        # still uploads partial summaries useful for the audit evidence pack.
        run: |
          set -o pipefail
          forge coverage --report summary --report lcov 2>&1 | tee coverage-summary.txt
        continue-on-error: true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-summary.txt
            lcov.info
          if-no-files-found: warn
          retention-days: 30
