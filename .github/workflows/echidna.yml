name: Echidna

on:
  push:
    branches: [main, 'feat/**', 'chore/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  echidna-founder-vesting-v2:
    name: Echidna FounderVestingV2 (200k runs)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Python + crytic-compile
        # Echidna shells out to crytic-compile to drive solc; missing it makes
        # echidna print "crytic-compile not installed" and exit 0 (via tee) —
        # silent false-pass. Install pinned versions for reproducible CI.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crytic-compile
        run: |
          pip install crytic-compile==0.3.7
          crytic-compile --version

      - name: Install Echidna
        run: |
          wget https://github.com/crytic/echidna/releases/download/v2.2.5/echidna-2.2.5-x86_64-linux.tar.gz
          tar -xzf echidna-2.2.5-x86_64-linux.tar.gz
          sudo mv echidna /usr/local/bin/
          echidna --version

      - name: Build contracts (incl. test/echidna/)
        # Full build required: echidna needs the test contract artifact, which
        # `--skip test` would exclude. Source-only contracts already compile in
        # the CI workflow's `forge build --sizes` step.
        run: forge build

      - name: Run Echidna on FounderVestingV2
        # `set -o pipefail` so echidna's non-zero exit propagates through tee.
        # Explicit file path (instead of `.`) since echidna 2.2.5 can't always
        # autodiscover contracts inside nested test/ trees.
        run: |
          set -o pipefail
          echidna test/echidna/immutables/EchidnaFounderVestingV2.sol \
            --contract EchidnaFounderVestingV2 \
            --config echidna-fv.yaml \
            2>&1 | tee echidna-fv-output.log
        env:
          FOUNDRY_PROFILE: default

      - name: Upload Echidna logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echidna-fv-output
          path: echidna-fv-output.log
          retention-days: 30

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echidna-fv-corpus
          path: corpus/founder-vesting-v2/
          retention-days: 30
