name: Echidna

on:
  push:
    branches: [main, 'feat/**', 'chore/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  echidna-fv:
    name: Echidna FounderVestingV2 (200k runs)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Python + crytic-compile
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crytic-compile
        run: |
          pip install crytic-compile==0.3.7
          crytic-compile --version

      - name: Install Echidna
        run: |
          wget https://github.com/crytic/echidna/releases/download/v2.2.5/echidna-2.2.5-x86_64-linux.tar.gz
          tar -xzf echidna-2.2.5-x86_64-linux.tar.gz
          sudo mv echidna /usr/local/bin/
          echidna --version

      - name: Build contracts (incl. test/echidna/)
        run: forge build

      - name: Run Echidna on FounderVestingV2
        run: |
          set -o pipefail
          echidna test/echidna/immutables/EchidnaFounderVestingV2.sol \
            --contract EchidnaFounderVestingV2 \
            --config echidna-fv.yaml \
            2>&1 | tee echidna-fv-output.log
        env:
          FOUNDRY_PROFILE: default

      - name: Upload Echidna logs (FV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echidna-fv-output
          path: echidna-fv-output.log
          retention-days: 30

      - name: Upload corpus (FV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echidna-fv-corpus
          path: corpus/founder-vesting-v2/
          retention-days: 30

  # [Sprint T-30b Phase C] re-introduce shield-fuzzing matrix with 200k runs.
  echidna-shields:
    name: Echidna ${{ matrix.shield }} (200k runs)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - shield: FlashBTCShield1h
            config: echidna-shield-flashbtc1h.yaml
            contract: EchidnaFlashBTCShield1h
            file: test/echidna/shields/EchidnaFlashBTCShield1h.sol
            corpus: corpus/shields/flashbtc1h
          - shield: FlashBTCShield24h
            config: echidna-shield-flashbtc24h.yaml
            contract: EchidnaFlashBTCShield24h
            file: test/echidna/shields/EchidnaFlashBTCShield24h.sol
            corpus: corpus/shields/flashbtc24h
          - shield: FlashBTCShield48h
            config: echidna-shield-flashbtc48h.yaml
            contract: EchidnaFlashBTCShield48h
            file: test/echidna/shields/EchidnaFlashBTCShield48h.sol
            corpus: corpus/shields/flashbtc48h
          - shield: FlashETHShield1h
            config: echidna-shield-flasheth1h.yaml
            contract: EchidnaFlashETHShield1h
            file: test/echidna/shields/EchidnaFlashETHShield1h.sol
            corpus: corpus/shields/flasheth1h
          - shield: FlashETHShield24h
            config: echidna-shield-flasheth24h.yaml
            contract: EchidnaFlashETHShield24h
            file: test/echidna/shields/EchidnaFlashETHShield24h.sol
            corpus: corpus/shields/flasheth24h
          - shield: FlashETHShield48h
            config: echidna-shield-flasheth48h.yaml
            contract: EchidnaFlashETHShield48h
            file: test/echidna/shields/EchidnaFlashETHShield48h.sol
            corpus: corpus/shields/flasheth48h

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Python + crytic-compile
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crytic-compile
        run: |
          pip install crytic-compile==0.3.7
          crytic-compile --version

      - name: Install Echidna
        run: |
          wget https://github.com/crytic/echidna/releases/download/v2.2.5/echidna-2.2.5-x86_64-linux.tar.gz
          tar -xzf echidna-2.2.5-x86_64-linux.tar.gz
          sudo mv echidna /usr/local/bin/
          echidna --version

      - name: Build contracts
        run: forge build

      - name: Run Echidna on ${{ matrix.shield }} (200k)
        run: |
          set -o pipefail
          echidna ${{ matrix.file }} \
            --contract ${{ matrix.contract }} \
            --config ${{ matrix.config }} \
            2>&1 | tee echidna-${{ matrix.shield }}-output.log
        env:
          FOUNDRY_PROFILE: default

      - name: Upload Echidna logs (${{ matrix.shield }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echidna-${{ matrix.shield }}-output
          path: echidna-${{ matrix.shield }}-output.log
          retention-days: 30

      - name: Upload corpus (${{ matrix.shield }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echidna-${{ matrix.shield }}-corpus
          path: ${{ matrix.corpus }}/
          retention-days: 30
