name: Aderyn

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  aderyn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Run Aderyn
        uses: Cyfrin/aderyn-action@v0.6.8
        with:
          path: .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aderyn-report
          path: report.md
          if-no-files-found: warn
          retention-days: 30
