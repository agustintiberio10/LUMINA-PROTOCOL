name: Aderyn

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  aderyn:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Aderyn
        run: |
          set -euo pipefail
          curl -L -o /tmp/aderyn.tar.xz \
            https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-x86_64-unknown-linux-gnu.tar.xz
          tar -xf /tmp/aderyn.tar.xz -C /tmp
          sudo mv /tmp/aderyn-x86_64-unknown-linux-gnu/aderyn /usr/local/bin/aderyn
          aderyn --version

      - name: Run Aderyn
        run: aderyn . --output report.md
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aderyn-report
          path: report.md
          if-no-files-found: warn
          retention-days: 30
