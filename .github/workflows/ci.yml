name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -v

      - name: Format check
        run: forge fmt --check

      # NOTE: Gas report disabled. Bug pre-existente en tests con
      # --gas-report mode (nonce drift en computeCreateAddress).
      # Pendiente fix completo en Fase 2 Hardening.
      # Lumina opera en Base L2 donde gas es ínfimo, no bloqueante.
      - name: Gas report
        if: false  # Disabled hasta sprint dedicado en Fase 2 Hardening
        run: forge test --gas-report
