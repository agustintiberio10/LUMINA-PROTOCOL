name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # [Sprint FV] Fork-test RPC URL passed via repo secret. Foundry's
      # foundry.toml `[rpc_endpoints]` block uses `${BASE_SEPOLIA_RPC}` to
      # resolve the `base_sepolia` alias used by test/integration/immutables/
      # fork tests. Without this env var those tests skip via the
      # `requiresFork` modifier (vm.envString fallthrough).
      BASE_SEPOLIA_RPC: ${{ secrets.BASE_SEPOLIA_RPC }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -v

      - name: Format check
        run: forge fmt --check

      # NOTE: Gas report disabled. Bug pre-existente en tests con
      # --gas-report mode (nonce drift en computeCreateAddress).
      # Pendiente fix completo en Fase 2 Hardening.
      # Lumina opera en Base L2 donde gas es ínfimo, no bloqueante.
      - name: Gas report
        if: false  # Disabled hasta sprint dedicado en Fase 2 Hardening
        run: forge test --gas-report
