name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Forge fmt check
        run: forge fmt --check

      - name: Forge build
        run: forge build --sizes

      - name: Forge test (unit)
        run: forge test -vvv --no-match-contract "Fork|Invariant"

      - name: Forge test (invariants)
        run: forge test --match-contract Invariant -vvv

      - name: Forge test (fork)
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: forge test --match-contract Fork --fork-url $BASE_RPC_URL -vvv
        if: env.BASE_RPC_URL != ''

      - name: Forge coverage
        run: forge coverage --report summary > coverage-summary.txt || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.txt

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          fail-on: high
