[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
via_ir = true
# [Sprint CC] Pin EVM chain_id to Base Sepolia for the forge test suite so the
# ChainGuard library's whitelist (8453 + 84532) does not reject existing tests.
# vm.chainId(...) cheatcodes in the new ChainGuard.t.sol tests override this
# per-test to exercise the revert paths for non-whitelisted chains.
chain_id = 84532
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@chainlink/contracts/=lib/chainlink/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
# [Sprint F] Multi-RPC redundant config for Base Sepolia.
# Use `--rpc-url <alias>` with one of the aliases below.
# Default `base_sepolia` resolves to Alchemy (primary). Use `_quicknode` or
# `_public` if Alchemy is rate-limited or down. ops should rotate primary
# in CI/scripts when one provider degrades; the others stay warm.
base_sepolia = "${BASE_SEPOLIA_RPC}"
base_sepolia_alchemy = "${BASE_SEPOLIA_RPC}"
base_sepolia_quicknode = "${BASE_SEPOLIA_QUICKNODE_RPC}"
base_sepolia_public = "https://sepolia.base.org"
base = "${BASE_RPC_URL}"
# [Audit #38] Public Base Mainnet endpoint for fork tests. Tests in
# test/audit/v5.1-uups/integration/mainnet-fork/ select this fork to
# exercise the deploy against real USDC, Chainlink oracles, Aave V3,
# and Uniswap V3.
base_mainnet = "https://mainnet.base.org"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api", chain = 8453 }

[fuzz]
runs = 10000
seed = '0x123'

[invariant]
runs = 1000
depth = 500
fail_on_revert = false
call_override = false

[profile.heavy.fuzz]
runs = 100000

[profile.heavy.invariant]
runs = 10000
depth = 100

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
